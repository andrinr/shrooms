name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-site:
    name: Validate frontend, backend and data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: node scripts/check_syntax.cjs
      - name: Package static frontend
        run: npm run build
      - name: Check model, backend, accounts and nationwide data
        run: node --test tests/*.test.cjs
      - name: Check Python preparation scripts
        run: python3 -m py_compile scripts/*.py
      - name: Package static site
        run: node scripts/package_site.cjs
      - name: Upload verified site
        uses: actions/upload-artifact@v4
        with:
          name: shrooms-static-site
          path: _site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  container:
    name: Build and smoke-test deployment container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t shrooms:test .
      - name: Validate Compose configuration
        run: DOMAIN=shrooms.example.com docker compose config --quiet
      - name: Run container and verify persistence
        run: |
          docker volume create shrooms-test
          docker run -d --name shrooms -p 3000:3000 -v shrooms-test:/app/storage -e NODE_ENV=development -e WEATHER_AUTO_REFRESH=false shrooms:test
          for attempt in $(seq 1 30); do curl --fail --silent http://localhost:3000/api/health && break; sleep 1; done
          curl --fail http://localhost:3000/api/config
          curl --fail http://localhost:3000/ > /dev/null
          docker exec shrooms node scripts/backup.cjs /app/storage/test-backup.sqlite
          docker restart shrooms
          for attempt in $(seq 1 30); do curl --fail --silent http://localhost:3000/api/health && break; sleep 1; done
          curl --fail http://localhost:3000/api/health
          docker exec shrooms node -e "const {DatabaseSync}=require('node:sqlite');const db=new DatabaseSync('/app/storage/test-backup.sqlite',{readOnly:true});if(db.prepare('PRAGMA integrity_check').get().integrity_check!=='ok')process.exit(1);db.close()"
      - name: Container logs
        if: always()
        run: docker logs shrooms || true
